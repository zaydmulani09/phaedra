[workspace]
resolver = "2"
members = [
    "crates/phaedra-cli",
    "crates/phaedra-core",
    "crates/phaedra-harness",
    "crates/phaedra-coverage",
    "crates/phaedra-mutator",
    "crates/phaedra-corpus",
    "crates/phaedra-llm",
    "crates/phaedra-schema",
    "crates/phaedra-targets",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["zaydmulani09"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
cc = "1"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
toml = "0.8"
chrono = "0.4"
ratatui = "0.28"
crossterm = "0.28"
indicatif = "0.17"
criterion = { version = "0.5", features = ["html_reports"] }
